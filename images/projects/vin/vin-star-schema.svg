<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 730" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <style>
      .dim { fill: #ffffff; stroke: #d3e4dc; stroke-width: 1.5; }
      .fact { fill: #e3f4ed; stroke: #0b7f65; stroke-width: 2; }
      .agg { fill: #f6f8f7; stroke: #c9d6d0; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .kind { font-size: 10.5px; font-weight: 700; letter-spacing: 1px; fill: #86978f; }
      .kind-fact { font-size: 10.5px; font-weight: 700; letter-spacing: 1px; fill: #0b7f65; }
      .name { font-size: 14px; font-weight: 700; fill: #10241f; }
      .grain { font-size: 12px; fill: #2f403a; }
      .attr { font-size: 11.5px; fill: #5e6e68; }
      .link { fill: none; stroke: #a9d6c6; stroke-width: 1.6; }
      .note { font-size: 12.5px; fill: #5e6e68; }
    </style>
  </defs>

  <!-- date table to every fact table -->
  <path class="link" d="M104 92 V170"/>
  <path class="link" d="M276 92 V170"/>
  <path class="link" d="M448 92 V170"/>
  <path class="link" d="M620 92 V170"/>
  <path class="link" d="M792 92 V170"/>
  <path class="link" d="M964 92 V170"/>
  <path class="link" d="M1136 92 V170"/>

  <!-- dimension tables to fact tables (one-to-many) -->
  <path class="link" d="M240 420 L430 300"/>
  <path class="link" d="M275 420 L582 300"/>
  <path class="link" d="M400 420 L466 300"/>
  <path class="link" d="M450 420 L598 300"/>
  <path class="link" d="M500 420 L770 300"/>
  <path class="link" d="M773 420 L630 300"/>
  <path class="link" d="M990 420 L645 300"/>
  <path class="link" d="M1040 420 L814 300"/>
  <path class="link" d="M1110 420 L1136 300"/>

  <!-- date table -->
  <rect class="dim" x="22" y="20" width="1196" height="72" rx="12"/>
  <text class="kind" x="44" y="46">DIM · DATE TABLE · FILTERS EVERY FACT TABLE</text>
  <text class="name" x="44" y="72">date</text>
  <text class="attr" x="90" y="72">one row per day, 01/01/2012 – 31/12/2022 · built in Python, marked as the date table in Power BI</text>

  <!-- fact tables -->
  <rect class="fact" x="22" y="170" width="164" height="130" rx="12"/>
  <text class="kind-fact" x="36" y="194">FACT</text>
  <text class="name" x="36" y="216">web_traffic</text>
  <text class="grain" x="36" y="240">1 row = 1 day</text>
  <text class="attr" x="36" y="262">sessions, page views,</text>
  <text class="attr" x="36" y="280">conversion rate</text>

  <rect class="fact" x="194" y="170" width="164" height="130" rx="12"/>
  <text class="kind-fact" x="208" y="194">FACT</text>
  <text class="name" x="208" y="216">sales_daily</text>
  <text class="grain" x="208" y="240">1 row = 1 day</text>
  <text class="attr" x="208" y="262">revenue, COGS, margin,</text>
  <text class="attr" x="208" y="280">MA7 / MA30, YoY</text>

  <rect class="fact" x="366" y="170" width="164" height="130" rx="12"/>
  <text class="kind-fact" x="380" y="194">FACT</text>
  <text class="name" x="380" y="216">orders</text>
  <text class="grain" x="380" y="240">1 row = 1 order</text>
  <text class="attr" x="380" y="262">every status, payment,</text>
  <text class="attr" x="380" y="280">refund, new vs repeat</text>

  <rect class="fact" x="538" y="170" width="164" height="130" rx="12"/>
  <text class="kind-fact" x="552" y="194">FACT</text>
  <text class="name" x="552" y="216">orders_enriched</text>
  <text class="grain" x="552" y="240">1 row = 1 order line</text>
  <text class="attr" x="552" y="262">revenue, discount,</text>
  <text class="attr" x="552" y="280">cost, gross profit</text>

  <rect class="fact" x="710" y="170" width="164" height="130" rx="12"/>
  <text class="kind-fact" x="724" y="194">FACT</text>
  <text class="name" x="724" y="216">returns_enriched</text>
  <text class="grain" x="724" y="240">1 row = 1 return</text>
  <text class="attr" x="724" y="262">reason, quantity,</text>
  <text class="attr" x="724" y="280">days to return</text>

  <rect class="fact" x="882" y="170" width="164" height="130" rx="12"/>
  <text class="kind-fact" x="896" y="194">FACT</text>
  <text class="name" x="896" y="216">shipments_enriched</text>
  <text class="grain" x="896" y="240">1 row = 1 shipment</text>
  <text class="attr" x="896" y="262">ship &amp; delivery days,</text>
  <text class="attr" x="896" y="280">delivery bucket</text>

  <rect class="fact" x="1054" y="170" width="164" height="130" rx="12"/>
  <text class="kind-fact" x="1068" y="194">FACT</text>
  <text class="name" x="1068" y="216">inventory</text>
  <text class="grain" x="1068" y="240">1 row = SKU-month</text>
  <text class="attr" x="1068" y="262">stock value, DOS,</text>
  <text class="attr" x="1068" y="280">health label</text>

  <!-- dimension tables -->
  <rect class="dim" x="22" y="420" width="275" height="96" rx="12"/>
  <text class="kind" x="40" y="446">DIM</text>
  <text class="name" x="40" y="470">geography</text>
  <text class="attr" x="40" y="494">zip, city, district, region</text>

  <rect class="dim" x="329" y="420" width="275" height="96" rx="12"/>
  <text class="kind" x="347" y="446">DIM</text>
  <text class="name" x="347" y="470">customers_rfm</text>
  <text class="attr" x="347" y="494">demographics, RFM scores, segment</text>

  <rect class="dim" x="636" y="420" width="275" height="96" rx="12"/>
  <text class="kind" x="654" y="446">DIM</text>
  <text class="name" x="654" y="470">promotions</text>
  <text class="attr" x="654" y="494">type (% / fixed), value, period</text>

  <rect class="dim" x="943" y="420" width="275" height="96" rx="12"/>
  <text class="kind" x="961" y="446">DIM</text>
  <text class="name" x="961" y="470">products</text>
  <text class="attr" x="961" y="494">SKU, category, margin, rating, returns</text>

  <!-- pre-aggregated tables -->
  <text class="kind" x="22" y="572">AGG · PRE-AGGREGATED · NO RELATIONSHIPS</text>
  <rect class="agg" x="22" y="586" width="388" height="74" rx="12"/>
  <text class="name" x="40" y="616">monthly_summary</text>
  <text class="attr" x="40" y="640">1 row = 1 month · KPIs with MoM / YoY growth</text>

  <rect class="agg" x="426" y="586" width="388" height="74" rx="12"/>
  <text class="name" x="444" y="616">cohort_retention</text>
  <text class="attr" x="444" y="640">1 row = cohort × month 0–24 · retention rate</text>

  <rect class="agg" x="830" y="586" width="388" height="74" rx="12"/>
  <text class="name" x="848" y="616">reviews_summary</text>
  <text class="attr" x="848" y="640">1 row = month × category · rating trend</text>

  <text class="note" x="22" y="698">Each line is a one-to-many, single-direction relationship from a dim to a fact table. Fact tables never link to each other,</text>
  <text class="note" x="22" y="718">so every filter has exactly one path. Files are named dim_*, fact_*, and agg_*.</text>
</svg>
