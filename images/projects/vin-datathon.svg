<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14532d"/>
      <stop offset="1" stop-color="#2d8c3e"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4ade80" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#4ade80" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#ffffff" stroke-opacity="0.07"/>
    </pattern>
  </defs>
  <rect width="600" height="300" fill="url(#bg)"/>
  <rect width="600" height="300" fill="url(#grid)"/>

  <!-- sales trend -->
  <path d="M0 250 L60 235 L120 242 L180 205 L240 215 L300 175 L360 185 L420 135 L480 145 L540 95 L600 100 L600 300 L0 300Z" fill="url(#area)"/>
  <path d="M0 250 L60 235 L120 242 L180 205 L240 215 L300 175 L360 185 L420 135 L480 145 L540 95 L600 100" fill="none" stroke="#86efac" stroke-width="3"/>
  <g fill="#ffffff">
    <circle cx="420" cy="135" r="5"/><circle cx="540" cy="95" r="5"/>
  </g>

  <!-- hanger with dress -->
  <g transform="translate(70 40)">
    <path d="M70 18 a12 12 0 1 1 12 12 v10" fill="none" stroke="#f0fdf4" stroke-width="5" stroke-linecap="round"/>
    <path d="M82 40 L10 78 L154 78 Z" fill="none" stroke="#f0fdf4" stroke-width="5" stroke-linejoin="round"/>
    <path d="M56 78 L108 78 L114 110 L150 210 L14 210 L50 110 Z" fill="#f0fdf4"/>
    <path d="M50 110 L114 110" stroke="#2d8c3e" stroke-width="5"/>
  </g>

  <!-- shopping bag -->
  <g transform="translate(250 95)">
    <path d="M40 40 v-12 a28 28 0 0 1 56 0 v12" fill="none" stroke="#bbf7d0" stroke-width="6" stroke-linecap="round"/>
    <rect x="10" y="40" width="116" height="115" rx="12" fill="#4ade80"/>
    <rect x="10" y="40" width="116" height="18" rx="6" fill="#22c55e"/>
    <path d="M52 100 l12 12 l24 -26" fill="none" stroke="#14532d" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- bars -->
  <g fill="#ffffff" fill-opacity="0.18">
    <rect x="440" y="200" width="22" height="70" rx="4"/>
    <rect x="472" y="170" width="22" height="100" rx="4"/>
    <rect x="504" y="185" width="22" height="85" rx="4"/>
    <rect x="536" y="150" width="22" height="120" rx="4"/>
  </g>
</svg>
