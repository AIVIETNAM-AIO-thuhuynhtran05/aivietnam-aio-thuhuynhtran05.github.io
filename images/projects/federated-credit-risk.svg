<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2e24"/>
      <stop offset="1" stop-color="#166534"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4ade80" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#4ade80" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="300" fill="url(#bg)"/>
  <circle cx="300" cy="150" r="140" fill="url(#glow)"/>

  <!-- links from server to the 5 clients (weights only, dashed) -->
  <g stroke="#86efac" stroke-width="2" stroke-dasharray="6 6" stroke-opacity="0.7">
    <line x1="300" y1="150" x2="95" y2="80"/>
    <line x1="300" y1="150" x2="95" y2="225"/>
    <line x1="300" y1="150" x2="300" y2="40"/>
    <line x1="300" y1="150" x2="505" y2="80"/>
    <line x1="300" y1="150" x2="505" y2="225"/>
  </g>

  <!-- server -->
  <g transform="translate(300 150)">
    <circle r="34" fill="#4ade80"/>
    <g fill="#14532d">
      <rect x="-16" y="-17" width="32" height="9" rx="2"/>
      <rect x="-16" y="-4" width="32" height="9" rx="2"/>
      <rect x="-16" y="9" width="32" height="9" rx="2"/>
    </g>
    <g fill="#bbf7d0"><circle cx="-10" cy="-12.5" r="2"/><circle cx="-10" cy="0.5" r="2"/><circle cx="-10" cy="13.5" r="2"/></g>
  </g>

  <!-- client: a small heterogeneous graph (customer -> history records) -->
  <defs>
  <g id="client">
    <circle r="40" fill="#ffffff" fill-opacity="0.08" stroke="#4ade80" stroke-opacity="0.5"/>
    <g stroke="#bbf7d0" stroke-width="1.5" stroke-opacity="0.8">
      <line x1="0" y1="-4" x2="-20" y2="-22"/><line x1="0" y1="-4" x2="22" y2="-18"/>
      <line x1="0" y1="-4" x2="-18" y2="20"/><line x1="0" y1="-4" x2="20" y2="20"/>
      <line x1="20" y1="20" x2="30" y2="2"/>
    </g>
    <circle cx="0" cy="-4" r="8" fill="#4ade80"/>
    <circle cx="-20" cy="-22" r="5" fill="#fde68a"/>
    <circle cx="22" cy="-18" r="5" fill="#fde68a"/>
    <circle cx="-18" cy="20" r="5" fill="#93c5fd"/>
    <circle cx="20" cy="20" r="5" fill="#93c5fd"/>
    <circle cx="30" cy="2" r="4" fill="#fca5a5"/>
  </g>
  </defs>
  <use href="#client" x="95" y="80"/>
  <use href="#client" x="95" y="225"/>
  <use href="#client" x="300" y="40" transform="translate(300 40) scale(0.8) translate(-300 -40)"/>
  <use href="#client" x="505" y="80"/>
  <use href="#client" x="505" y="225"/>
</svg>
