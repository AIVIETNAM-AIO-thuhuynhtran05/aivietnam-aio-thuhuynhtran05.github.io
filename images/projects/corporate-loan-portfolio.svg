<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#ffffff" stroke-opacity="0.07"/>
    </pattern>
  </defs>
  <rect width="600" height="300" fill="url(#bg)"/>
  <rect width="600" height="300" fill="url(#grid)"/>

  <!-- bank building -->
  <g transform="translate(150 150)" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">
    <path d="M-80 -30 L0 -78 L80 -30 Z" fill="#ffffff" fill-opacity="0.14"/>
    <path d="M-62 -18 V52 M-31 -18 V52 M0 -18 V52 M31 -18 V52 M62 -18 V52"/>
    <path d="M-86 66 H86 M-76 52 H76"/>
  </g>

  <!-- portfolio bars by segment -->
  <g fill="#dbeafe" fill-opacity="0.85">
    <rect x="330" y="180" width="34" height="60" rx="4"/>
    <rect x="378" y="140" width="34" height="100" rx="4"/>
    <rect x="426" y="160" width="34" height="80" rx="4"/>
    <rect x="474" y="110" width="34" height="130" rx="4"/>
  </g>
  <rect x="522" y="200" width="34" height="40" rx="4" fill="#fbbf24"/>
  <path d="M320 240 H566" stroke="#ffffff" stroke-width="3" stroke-opacity="0.7"/>

  <!-- risk trend line -->
  <polyline points="347,150 395,118 443,132 491,84 539,170" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <g fill="#ffffff">
    <circle cx="347" cy="150" r="5"/><circle cx="395" cy="118" r="5"/><circle cx="443" cy="132" r="5"/>
    <circle cx="491" cy="84" r="5"/><circle cx="539" cy="170" r="6" fill="#fbbf24"/>
  </g>
</svg>
