<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9a3412"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#ffffff" stroke-opacity="0.07"/>
    </pattern>
  </defs>
  <rect width="600" height="300" fill="url(#bg)"/>
  <rect width="600" height="300" fill="url(#grid)"/>

  <!-- lineage: raw -> staging -> marts -->
  <g fill="none" stroke="#ffedd5" stroke-width="3" stroke-opacity="0.7">
    <path d="M150 70 C200 70 200 110 250 110"/>
    <path d="M150 150 C200 150 200 110 250 110"/>
    <path d="M150 150 C200 150 200 190 250 190"/>
    <path d="M150 230 C200 230 200 190 250 190"/>
    <path d="M350 110 C400 110 400 150 450 150"/>
    <path d="M350 190 C400 190 400 150 450 150"/>
  </g>

  <!-- raw sources -->
  <g fill="#fff7ed" fill-opacity="0.16" stroke="#ffedd5" stroke-width="2.5">
    <rect x="50" y="48" width="100" height="44" rx="8"/>
    <rect x="50" y="128" width="100" height="44" rx="8"/>
    <rect x="50" y="208" width="100" height="44" rx="8"/>
  </g>
  <g fill="#ffedd5" fill-opacity="0.85">
    <rect x="64" y="62" width="56" height="7" rx="3.5"/><rect x="64" y="75" width="36" height="6" rx="3"/>
    <rect x="64" y="142" width="56" height="7" rx="3.5"/><rect x="64" y="155" width="36" height="6" rx="3"/>
    <rect x="64" y="222" width="56" height="7" rx="3.5"/><rect x="64" y="235" width="36" height="6" rx="3"/>
  </g>

  <!-- staging models -->
  <g fill="#fff7ed" fill-opacity="0.28" stroke="#ffffff" stroke-width="2.5">
    <rect x="250" y="88" width="100" height="44" rx="8"/>
    <rect x="250" y="168" width="100" height="44" rx="8"/>
  </g>
  <g fill="#ffffff" fill-opacity="0.9">
    <rect x="264" y="102" width="60" height="7" rx="3.5"/><rect x="264" y="115" width="40" height="6" rx="3"/>
    <rect x="264" y="182" width="60" height="7" rx="3.5"/><rect x="264" y="195" width="40" height="6" rx="3"/>
  </g>

  <!-- mart -->
  <rect x="450" y="115" width="110" height="70" rx="10" fill="#ffffff"/>
  <rect x="464" y="130" width="70" height="9" rx="4.5" fill="#ea580c"/>
  <rect x="464" y="147" width="82" height="6" rx="3" fill="#fdba74"/>
  <rect x="464" y="160" width="62" height="6" rx="3" fill="#fdba74"/>
</svg>
