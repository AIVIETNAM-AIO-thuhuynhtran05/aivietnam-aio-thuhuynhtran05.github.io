<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#065f46"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
  </defs>
  <rect width="600" height="300" fill="url(#bg)"/>
  <circle cx="520" cy="40" r="140" fill="#ffffff" fill-opacity="0.05"/>
  <circle cx="60" cy="290" r="110" fill="#ffffff" fill-opacity="0.05"/>

  <!-- back card -->
  <g transform="rotate(-10 200 150)">
    <rect x="70" y="80" width="250" height="155" rx="16" fill="#ffffff" fill-opacity="0.15"/>
  </g>
  <!-- front card -->
  <g transform="rotate(-4 220 160)">
    <rect x="90" y="95" width="250" height="155" rx="16" fill="url(#card)"/>
    <rect x="90" y="125" width="250" height="26" fill="#14532d" fill-opacity="0.35"/>
    <rect x="112" y="168" width="40" height="30" rx="5" fill="#fef3c7"/>
    <g fill="#ffffff" fill-opacity="0.9">
      <rect x="112" y="214" width="44" height="8" rx="4"/>
      <rect x="166" y="214" width="44" height="8" rx="4"/>
      <rect x="220" y="214" width="44" height="8" rx="4"/>
      <rect x="274" y="214" width="44" height="8" rx="4"/>
    </g>
    <circle cx="300" cy="180" r="13" fill="#ffffff" fill-opacity="0.6"/>
    <circle cx="316" cy="180" r="13" fill="#ffffff" fill-opacity="0.35"/>
  </g>

  <!-- segmentation donut: thriving / stretched / drifting -->
  <g transform="translate(470 150)" fill="none" stroke-width="26">
    <circle r="62" stroke="#86efac" stroke-dasharray="175 215" transform="rotate(-90)"/>
    <circle r="62" stroke="#fde68a" stroke-dasharray="120 270" stroke-dashoffset="-175" transform="rotate(-90)"/>
    <circle r="62" stroke="#fca5a5" stroke-dasharray="95 295" stroke-dashoffset="-295" transform="rotate(-90)"/>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#ecfdf5">
    <circle cx="410" cy="250" r="5" fill="#86efac"/><text x="420" y="255">Thriving</text>
    <circle cx="410" cy="272" r="5" fill="#fde68a"/><text x="420" y="277">Stretched</text>
    <circle cx="500" cy="250" r="5" fill="#fca5a5"/><text x="510" y="255">Drifting</text>
  </g>
</svg>
