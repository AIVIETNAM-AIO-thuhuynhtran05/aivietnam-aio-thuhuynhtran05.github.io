<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9f1239"/>
      <stop offset="1" stop-color="#f43f5e"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#ffffff" stroke-opacity="0.07"/>
    </pattern>
  </defs>
  <rect width="600" height="300" fill="url(#bg)"/>
  <rect width="600" height="300" fill="url(#grid)"/>

  <!-- star schema: links -->
  <g stroke="#ffe4e6" stroke-width="3" stroke-opacity="0.7">
    <line x1="230" y1="150" x2="110" y2="70"/>
    <line x1="230" y1="150" x2="350" y2="70"/>
    <line x1="230" y1="150" x2="110" y2="230"/>
    <line x1="230" y1="150" x2="350" y2="230"/>
  </g>

  <!-- dimension tables -->
  <g fill="#fff1f2" fill-opacity="0.16" stroke="#ffe4e6" stroke-width="2.5">
    <rect x="60" y="45" width="100" height="50" rx="8"/>
    <rect x="300" y="45" width="100" height="50" rx="8"/>
    <rect x="60" y="205" width="100" height="50" rx="8"/>
    <rect x="300" y="205" width="100" height="50" rx="8"/>
  </g>
  <g fill="#ffe4e6" fill-opacity="0.85">
    <rect x="72" y="58" width="56" height="7" rx="3.5"/><rect x="72" y="72" width="36" height="6" rx="3"/>
    <rect x="312" y="58" width="56" height="7" rx="3.5"/><rect x="312" y="72" width="36" height="6" rx="3"/>
    <rect x="72" y="218" width="56" height="7" rx="3.5"/><rect x="72" y="232" width="36" height="6" rx="3"/>
    <rect x="312" y="218" width="56" height="7" rx="3.5"/><rect x="312" y="232" width="36" height="6" rx="3"/>
  </g>

  <!-- fact table -->
  <rect x="170" y="115" width="120" height="70" rx="10" fill="#ffffff"/>
  <rect x="184" y="130" width="72" height="9" rx="4.5" fill="#e11d48"/>
  <rect x="184" y="147" width="92" height="6" rx="3" fill="#fda4af"/>
  <rect x="184" y="160" width="70" height="6" rx="3" fill="#fda4af"/>

  <!-- OLAP cube -->
  <g transform="translate(470 150)" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">
    <path d="M0 -62 L54 -31 L54 31 L0 62 L-54 31 L-54 -31 Z" fill="#ffffff" fill-opacity="0.1"/>
    <path d="M-54 -31 L0 0 L54 -31 M0 0 V62"/>
    <path d="M-27 -46 L27 -15 M27 -46 L-27 -15" stroke-opacity="0.45" stroke-width="2.5"/>
  </g>
</svg>
