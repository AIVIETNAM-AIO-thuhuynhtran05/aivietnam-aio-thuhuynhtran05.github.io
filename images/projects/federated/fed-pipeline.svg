<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1068" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3451a8"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#23775a"/></marker>
  </defs>
  <rect width="1200" height="1068" fill="#ffffff"/>

  <!-- shared steps -->
  <rect fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" x="330" y="20" width="540" height="64" rx="8"/>
  <text font-size="19" font-weight="600" fill="#0f172a" text-anchor="middle" x="600" y="48">Home Credit relational data</text>
  <text font-size="14" fill="#475569" text-anchor="middle" x="600" y="70">7 tables · 307,511 customers with a default label (8.07%)</text>
  <path stroke="#64748b" stroke-width="2" fill="none" d="M600 84V108" marker-end="url(#a)"/>

  <rect fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" x="330" y="112" width="540" height="64" rx="8"/>
  <text font-size="19" font-weight="600" fill="#0f172a" text-anchor="middle" x="600" y="140">Data quality and orphan records</text>
  <text font-size="14" fill="#475569" text-anchor="middle" x="600" y="162">missing parent loan: card 27% · installment 8.8% · POS 3.4%</text>
  <path stroke="#64748b" stroke-width="2" fill="none" d="M600 176V200" marker-end="url(#a)"/>

  <rect fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" x="330" y="204" width="540" height="64" rx="8"/>
  <text font-size="19" font-weight="600" fill="#0f172a" text-anchor="middle" x="600" y="232">One shared split: Train / Val / Test = 70 / 15 / 15</text>
  <text font-size="14" fill="#475569" text-anchor="middle" x="600" y="254">stratified by default label · same test customers for every model</text>

  <path stroke="#3451a8" stroke-width="2" fill="none" d="M600 268V290H300V318" marker-end="url(#b)"/>
  <path stroke="#23775a" stroke-width="2" fill="none" d="M600 290H900V318" marker-end="url(#g)"/>

  <!-- centralized branch -->
  <rect x="140" y="322" width="320" height="40" rx="20" fill="#3451a8"/>
  <text font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1.5" x="300" y="348">CENTRALIZED (UPPER BOUND)</text>
  <path stroke="#3451a8" stroke-width="2" fill="none" d="M300 362V384" marker-end="url(#b)"/>

  <rect fill="#eaf0fb" stroke="#3451a8" stroke-width="1.5" x="40" y="388" width="520" height="60" rx="8"/>
  <text font-size="19" font-weight="600" fill="#0f172a" text-anchor="middle" x="300" y="414">Rule-based cleaning, one schema</text>
  <text font-size="14" fill="#475569" text-anchor="middle" x="300" y="436">sentinel values → missing · financial ratio features</text>
  <path stroke="#3451a8" stroke-width="2" fill="none" d="M300 448V462H160V478" marker-end="url(#b)"/>
  <path stroke="#3451a8" stroke-width="2" fill="none" d="M300 462H440V478" marker-end="url(#b)"/>

  <rect fill="#eaf0fb" stroke="#3451a8" stroke-width="1.5" x="40" y="482" width="240" height="60" rx="8"/>
  <text font-size="19" font-weight="600" fill="#0f172a" text-anchor="middle" x="160" y="508">Tabular features</text>
  <text font-size="14" fill="#475569" text-anchor="middle" x="160" y="530">6 tables aggregated → 601</text>
  <rect fill="#eaf0fb" stroke="#3451a8" stroke-width="1.5" x="320" y="482" width="240" height="60" rx="8"/>
  <text font-size="19" font-weight="600" fill="#0f172a" text-anchor="middle" x="440" y="508">Global credit graph</text>
  <text font-size="14" fill="#475569" text-anchor="middle" x="440" y="530">6 node · 10 edge types</text>
  <path stroke="#3451a8" stroke-width="2" fill="none" d="M160 542V566" marker-end="url(#b)"/>
  <path stroke="#3451a8" stroke-width="2" fill="none" d="M440 542V566" marker-end="url(#b)"/>

  <rect fill="#eaf0fb" stroke="#3451a8" stroke-width="1.5" x="40" y="570" width="240" height="60" rx="8"/>
  <text font-size="19" font-weight="600" fill="#0f172a" text-anchor="middle" x="160" y="596">LogReg · LightGBM</text>
  <text font-size="14" fill="#475569" text-anchor="middle" x="160" y="618">encoders fit on Train only</text>
  <rect fill="#eaf0fb" stroke="#3451a8" stroke-width="1.5" x="320" y="570" width="240" height="60" rx="8"/>
  <text font-size="19" font-weight="600" fill="#0f172a" text-anchor="middle" x="440" y="596">HeteroGNN</text>
  <text font-size="14" fill="#475569" text-anchor="middle" x="440" y="618">2-layer SAGEConv</text>
  <path stroke="#3451a8" stroke-width="2" fill="none" d="M160 630V646H440V630M300 646V666" marker-end="url(#b)"/>

  <rect fill="#eaf0fb" stroke="#3451a8" stroke-width="1.5" x="40" y="670" width="520" height="60" rx="8"/>
  <text font-size="19" font-weight="600" fill="#0f172a" text-anchor="middle" x="300" y="696">Tune and pick threshold on shared Val</text>
  <text font-size="14" fill="#475569" text-anchor="middle" x="300" y="718">early stopping · threshold at max F1</text>
  <path stroke="#3451a8" stroke-width="2" fill="none" d="M300 730V926H540V938" marker-end="url(#b)"/>

  <!-- federated branch -->
  <rect x="740" y="322" width="320" height="40" rx="20" fill="#23775a"/>
  <text font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1.5" x="900" y="348">FEDERATED · 5 LENDERS</text>
  <path stroke="#23775a" stroke-width="2" fill="none" d="M900 362V384" marker-end="url(#g)"/>

  <rect fill="#e6f4ee" stroke="#23775a" stroke-width="1.5" x="640" y="388" width="520" height="60" rx="8"/>
  <text font-size="19" font-weight="600" fill="#0f172a" text-anchor="middle" x="900" y="414">Assign customers to lenders by region</text>
  <text font-size="14" fill="#475569" text-anchor="middle" x="900" y="436">81 regions, each owned by one lender · sizes from Dirichlet(α = 0.5)</text>
  <path stroke="#23775a" stroke-width="2" fill="none" d="M900 448V472" marker-end="url(#g)"/>

  <rect fill="#e6f4ee" stroke="#23775a" stroke-width="1.5" x="640" y="476" width="520" height="60" rx="8"/>
  <text font-size="19" font-weight="600" fill="#0f172a" text-anchor="middle" x="900" y="502">Local credit graph at each lender</text>
  <text font-size="14" fill="#475569" text-anchor="middle" x="900" y="524">own Train / Val / Test · orphan handling done locally</text>
  <path stroke="#23775a" stroke-width="2" fill="none" d="M900 536V560" marker-end="url(#g)"/>

  <rect fill="#e6f4ee" stroke="#23775a" stroke-width="1.5" x="640" y="564" width="520" height="60" rx="8"/>
  <text font-size="19" font-weight="600" fill="#0f172a" text-anchor="middle" x="900" y="590">Unified encoder from aggregate statistics</text>
  <text font-size="14" fill="#475569" text-anchor="middle" x="900" y="612">quantiles, medians, vocabularies, sums · no raw records shared</text>
  <path stroke="#23775a" stroke-width="2" fill="none" d="M900 624V638H765V654" marker-end="url(#g)"/>
  <path stroke="#23775a" stroke-width="2" fill="none" d="M900 638H1035V654" marker-end="url(#g)"/>

  <rect fill="#e6f4ee" stroke="#23775a" stroke-width="1.5" x="640" y="658" width="250" height="72" rx="8"/>
  <text font-size="19" font-weight="600" fill="#0f172a" text-anchor="middle" x="765" y="686">Local-only · FedAvg</text>
  <text font-size="14" fill="#475569" text-anchor="middle" x="765" y="708">no sharing vs. averaged</text>
  <text font-size="14" fill="#475569" text-anchor="middle" x="765" y="724">model weights</text>
  <rect fill="#e6f4ee" stroke="#23775a" stroke-width="1.5" x="910" y="658" width="250" height="72" rx="8"/>
  <text font-size="19" font-weight="600" fill="#0f172a" text-anchor="middle" x="1035" y="686">Personalized FL</text>
  <text font-size="14" fill="#475569" text-anchor="middle" x="1035" y="708">Fine-tune · FedProx</text>
  <text font-size="14" fill="#475569" text-anchor="middle" x="1035" y="724">FedPer · Ditto</text>
  <path stroke="#23775a" stroke-width="2" fill="none" d="M765 730V746H1035V730M900 746V766" marker-end="url(#g)"/>

  <rect fill="#e6f4ee" stroke="#23775a" stroke-width="1.5" x="640" y="770" width="520" height="60" rx="8"/>
  <text font-size="19" font-weight="600" fill="#0f172a" text-anchor="middle" x="900" y="796">Pick checkpoint and threshold per lender</text>
  <text font-size="14" fill="#475569" text-anchor="middle" x="900" y="818">on each lender's own validation set</text>
  <path stroke="#23775a" stroke-width="2" fill="none" d="M900 830V854" marker-end="url(#g)"/>

  <rect fill="#e6f4ee" stroke="#23775a" stroke-width="1.5" x="640" y="858" width="520" height="60" rx="8"/>
  <text font-size="19" font-weight="600" fill="#0f172a" text-anchor="middle" x="900" y="884">Hybrid: blend with each lender's own LightGBM</text>
  <text font-size="14" fill="#475569" text-anchor="middle" x="900" y="906">logit mix of federated + local model · weight chosen on lender's Val</text>
  <path stroke="#23775a" stroke-width="2" fill="none" d="M900 918V926H660V938" marker-end="url(#g)"/>

  <!-- comparison -->
  <rect x="300" y="942" width="600" height="104" rx="10" fill="#fff" stroke="#0f172a" stroke-width="2"/>
  <text font-size="19" font-weight="600" fill="#0f172a" text-anchor="middle" x="600" y="972">Output and comparison</text>
  <text font-size="14" fill="#475569" text-anchor="middle" x="600" y="996">default probability per applicant → flag at lender threshold</text>
  <text font-size="14" fill="#475569" text-anchor="middle" x="600" y="1018">ROC-AUC per lender · average · worst lender</text>
  <text font-size="14" fill="#475569" text-anchor="middle" x="600" y="1038">ΔAUC with 95% CI (paired bootstrap) · 3 seeds</text>
</svg>
